{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
            Chai Shop
        {% endblock %}
    </title>

    <!-- Base CSS -->
    <link rel="stylesheet" href="{% static 'chai/css/base.css' %}">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    {% block extra_css %}{% endblock %}
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="container nav-wrapper">
            <a href="/" class="logo">☕ ChaiShop</a>

            <ul class="nav-links">
                <li><a href="#">Home</a></li>
                <li><a href="#">Chai Menu</a></li>
                <li><a href="#">Cart</a></li>
                <li><a href="#">Login</a></li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content container">
        {% block content %}
        <!-- Page-specific content goes here -->
        {% endblock %}
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>© 2026 ChaiShop | Brewed with ❤️ in India</p>
        </div>
    </footer>

    {% block extra_js %}{% endblock %}
</body>
</html>
